name: run-tests

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 0 * * *"

jobs:
    test:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: [8.5, 8.4, 8.3]
                laravel: ["^13.0", "^12.0", "^11.0"]
                openspout: ["^5.0", "^4.30"]
                dependency-version: [prefer-stable]
                exclude:
                    - laravel: "^11.0"
                      php: 8.5
                    - openspout: "^5.0"
                      php: 8.3
        name: P${{ matrix.php }} - L${{ matrix.laravel }} - OpenSpout ${{ matrix.openspout }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Install dependencies
              run: |
                  composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-update
                  composer require "openspout/openspout:${{ matrix.openspout }}" --no-interaction --no-update
                  composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

            - name: Execute tests
              run: vendor/bin/pest

    databases:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                database: [mysql, pgsql]
        name: P8.4 - L^13.0 - ${{ matrix.database }}

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: import_engine_testing
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: password
                    POSTGRES_DB: import_engine_testing
                ports:
                    - 5432:5432
                options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_pgsql, sqlite, pdo_sqlite, bcmath, intl, fileinfo
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Execute tests
              run: vendor/bin/pest
              env:
                  DB_CONNECTION: ${{ matrix.database }}
                  DB_HOST: 127.0.0.1
                  DB_PORT: ${{ matrix.database == 'mysql' && 3306 || 5432 }}
                  DB_DATABASE: import_engine_testing
                  DB_USERNAME: root
                  DB_PASSWORD: password
